<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F5EDE3"/>
  <!-- Cream jar flat lay -->
  <ellipse cx="200" cy="240" rx="100" ry="30" fill="#FAF6F0" stroke="#B8804A" stroke-width="1.5"/>
  <rect x="100" y="140" width="200" height="100" rx="0" fill="#FAF6F0" stroke="#B8804A" stroke-width="1.5"/>
  <ellipse cx="200" cy="140" rx="100" ry="30" fill="#FAF6F0" stroke="#B8804A" stroke-width="1.5"/>
  <!-- Lid band -->
  <rect x="100" y="125" width="200" height="20" rx="0" fill="#2B2119" opacity="0.08"/>
  <!-- Label on jar -->
  <rect x="130" y="155" width="140" height="60" rx="2" fill="none" stroke="#D9A679" stroke-width="1"/>
  <line x1="148" y1="173" x2="252" y2="173" stroke="#2B2119" stroke-width="0.8" opacity="0.4"/>
  <line x1="148" y1="184" x2="252" y2="184" stroke="#B8804A" stroke-width="1.2"/>
  <line x1="155" y1="196" x2="245" y2="196" stroke="#2B2119" stroke-width="0.7" opacity="0.3"/>
  <!-- Cream swirl scoop -->
  <path d="M160,100 Q200,70 240,100" fill="none" stroke="#D9A679" stroke-width="8" stroke-linecap="round"/>
  <path d="M175,90 Q200,75 225,90" fill="none" stroke="#FAF6F0" stroke-width="4" stroke-linecap="round"/>
  <!-- Scattered rice grains -->
  <ellipse cx="80" cy="180" rx="12" ry="4" fill="#D9A679" opacity="0.35" transform="rotate(20 80 180)"/>
  <ellipse cx="320" cy="160" rx="10" ry="3.5" fill="#D9A679" opacity="0.3" transform="rotate(-15 320 160)"/>
  <ellipse cx="90" cy="290" rx="9" ry="3" fill="#B8804A" opacity="0.2" transform="rotate(35 90 290)"/>
  <text x="200" y="360" font-family="serif" font-size="11" fill="#2B2119" opacity="0.35" text-anchor="middle" letter-spacing="3">BARRIER CREAM</text>
</svg>
