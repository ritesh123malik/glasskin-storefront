  <ellipse cx="310" cy="70" rx="18" ry="7" fill="#B8804A" opacity="0.2" transform="rotate(-20 310 70)"/>
  <ellipse cx="340" cy="200" rx="20" ry="8" fill="#D9A679" opacity="0.22" transform="rotate(60 340 200)"/>
  <ellipse cx="60" cy="310" rx="16" ry="6" fill="#B8804A" opacity="0.18" transform="rotate(-40 60 310)"/>
  <ellipse cx="290" cy="340" rx="18" ry="7" fill="#D9A679" opacity="0.2" transform="rotate(15 290 340)"/>
  <!-- Central sprig / botanical -->
  <line x1="200" y1="320" x2="200" y2="100" stroke="#B8804A" stroke-width="2" opacity="0.4"/>
  <ellipse cx="200" cy="130" rx="30" ry="12" fill="#D9A679" opacity="0.5" transform="rotate(-10 200 130)"/>
  <ellipse cx="175" cy="165" rx="26" ry="10" fill="#D9A679" opacity="0.4" transform="rotate(-35 175 165)"/>
  <ellipse cx="225" cy="165" rx="26" ry="10" fill="#D9A679" opacity="0.4" transform="rotate(35 225 165)"/>
  <ellipse cx="185" cy="205" rx="22" ry="9" fill="#B8804A" opacity="0.35" transform="rotate(-20 185 205)"/>
  <ellipse cx="215" cy="205" rx="22" ry="9" fill="#B8804A" opacity="0.35" transform="rotate(20 215 205)"/>
  <ellipse cx="200" cy="240" rx="18" ry="8" fill="#D9A679" opacity="0.5" transform="rotate(0 200 240)"/>
  <!-- Dew drops on leaves -->
  <circle cx="195" cy="148" r="3" fill="#FAF6F0" opacity="0.7"/>
  <circle cx="220" cy="170" r="2.5" fill="#FAF6F0" opacity="0.6"/>
  <text x="200" y="368" font-family="serif" font-size="11" fill="#2B2119" opacity="0.35" text-anchor="middle" letter-spacing="3">OAT EXTRACT</text>
