<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#FAF6F0" />
  <rect x="20" y="20" width="160" height="160" rx="4" fill="none" stroke="#2B2119" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.2"/>
  
  <!-- Glow -->
  <circle cx="100" cy="110" r="45" fill="#B8804A" opacity="0.08" filter="blur(8px)" />
  
  <g stroke="#B8804A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bulb -->
    <path d="M92,44 C92,38 108,38 108,44" fill="#FAF6F0" />
    <rect x="90" y="44" width="20" height="4" rx="1" />
    
    <!-- Dropper Cap -->
    <rect x="86" y="48" width="28" height="16" rx="2" fill="#FAF6F0" />
    <line x1="86" y1="56" x2="114" y2="56" stroke-width="1" />
    
    <!-- Dropper Pipette shaft inside -->
    <line x1="100" y1="64" x2="100" y2="82" stroke="#2B2119" stroke-width="1" opacity="0.4" />
    
    <!-- Bottle body -->
    <path d="M76,66 L124,66 C128,66 130,69 130,73 L130,150 C130,155 125,160 119,160 L81,160 C75,160 70,155 70,150 L70,73 C70,69 72,66 76,66 Z" fill="#FAF6F0" />
    
    <!-- Label -->
    <rect x="78" y="88" width="44" height="52" rx="2" stroke="#2B2119" stroke-width="0.8" />
    
    <!-- Glaze Serum Details inside Label -->
    <circle cx="100" cy="106" r="6" stroke="#2B2119" stroke-width="0.8" />
    <line x1="100" y1="102" x2="100" y2="110" stroke="#2B2119" stroke-width="0.8" />
    <line x1="96" y1="106" x2="104" y2="106" stroke="#2B2119" stroke-width="0.8" />
    
    <line x1="86" y1="120" x2="114" y2="120" stroke="#2B2119" stroke-width="0.5" />
    <line x1="88" y1="126" x2="112" y2="126" stroke="#D9A679" stroke-width="0.8" />
    <line x1="92" y1="132" x2="108" y2="132" stroke="#2B2119" stroke-width="0.5" />
  </g>
</svg>
