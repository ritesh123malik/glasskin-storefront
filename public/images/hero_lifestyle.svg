<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="50%" stop-color="#F3EAE0" />
      <stop offset="100%" stop-color="#D9A679" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8804A" />
      <stop offset="100%" stop-color="#D9A679" />
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="450" height="600" fill="url(#warmGrad)" />
  
  <!-- Abstract Glowing Skin/Product Shapes -->
  <circle cx="350" cy="200" r="180" fill="#D9A679" opacity="0.15" filter="url(#softBlur)" />
  <circle cx="100" cy="450" r="220" fill="#B8804A" opacity="0.1" filter="url(#softBlur)" />
  
  <!-- Sleek Organic Curves (resembling face/body contours) -->
  <path d="M-50,250 C150,150 300,400 500,300" fill="none" stroke="#2B2119" stroke-width="0.75" opacity="0.12" />
  <path d="M-50,300 C180,220 280,450 500,350" fill="none" stroke="#2B2119" stroke-width="0.5" opacity="0.08" />
  <path d="M-50,200 C120,100 320,350 500,250" fill="none" stroke="#B8804A" stroke-width="1" opacity="0.2" />
  
  <!-- Floating Gold Droplets (skincare serum theme) -->
  <!-- Droplet 1 -->
  <path d="M220,240 C220,255 235,270 250,270 C265,270 280,255 280,240 C280,210 250,170 250,170 C250,170 220,210 220,240 Z" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="240" cy="235" r="4" fill="#FAF6F0" opacity="0.4" />
  
  <!-- Droplet 2 (smaller, offset) -->
  <path d="M160,340 C160,348 168,356 176,356 C184,356 192,348 192,340 C192,324 176,300 176,300 C176,300 160,324 160,340 Z" fill="url(#goldGrad)" opacity="0.6" />
  
  <!-- Droplet 3 -->
  <path d="M310,140 C310,145 315,150 320,150 C325,150 330,145 330,140 C330,130 320,115 320,115 C320,115 310,130 310,140 Z" fill="url(#goldGrad)" opacity="0.5" />

  <!-- Textured Noise or Subtle Rings -->
  <circle cx="250" cy="240" r="80" fill="none" stroke="#FAF6F0" stroke-width="0.5" opacity="0.3" />
  <circle cx="250" cy="240" r="120" fill="none" stroke="#FAF6F0" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2" />
  
  <!-- Typography Accent overlay -->
  <text x="30" y="550" font-family="var(--font-playfair), serif" font-size="24" font-weight="300" fill="#2B2119" opacity="0.15" letter-spacing="4">GLASSSKIN RITUAL</text>
</svg>
