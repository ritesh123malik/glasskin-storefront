<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#FAF6F0" />
  <rect x="20" y="20" width="160" height="160" rx="4" fill="none" stroke="#2B2119" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.2"/>
  
  <!-- Warm soft gradient glow in the center -->
  <circle cx="100" cy="105" r="45" fill="#D9A679" opacity="0.1" filter="blur(8px)" />
  
  <!-- Cleanser bottle line art -->
  <g stroke="#B8804A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pump head -->
    <path d="M90,50 L110,50" />
    <path d="M100,50 L100,60" />
    <path d="M100,45 L100,50" />
    <path d="M100,45 L86,47 C84,47.5 84,49.5 86,49.5" />
    
    <!-- Cap/Collar -->
    <rect x="88" y="60" width="24" height="8" rx="1" fill="#FAF6F0" />
    
    <!-- Bottle body -->
    <path d="M75,68 L125,68 C129,68 131,71 131,75 L131,148 C131,154 126,158 120,158 L80,158 C74,158 69,154 69,148 L69,75 C69,71 71,68 75,68 Z" fill="#FAF6F0" />
    
    <!-- Label -->
    <rect x="78" y="85" width="44" height="48" rx="2" stroke="#2B2119" stroke-width="0.8" />
    <line x1="86" y1="96" x2="114" y2="96" stroke="#2B2119" stroke-width="0.8" />
    <line x1="86" y1="104" x2="114" y2="104" stroke="#D9A679" stroke-dasharray="1,1" stroke-width="1" />
    <line x1="90" y1="112" x2="110" y2="112" stroke="#2B2119" stroke-width="0.5" />
    <line x1="92" y1="118" x2="108" y2="118" stroke="#2B2119" stroke-width="0.5" />
  </g>
</svg>
